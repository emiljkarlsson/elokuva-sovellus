<!DOCTYPE html>
<html>

<head>
  <title>Lisää elokuva</title>
</head>

<body>
  <form action="/result" method="post">
    <p>Elokuvan nimi: <br />
      <textarea name="message" rows="1" cols="50"></textarea>
    </p>
    <p>Vuosi: <br />
      <textarea name="message" rows="1" cols="4"></textarea>
    </p>
    <p>Valitse genre(t):</p>
    <p>
      <input type="checkbox" name="extra" value="A" /> Draama
      <input type="checkbox" name="extra" value="B" /> Komedia
    </p>
    <p>Kuvaus: <br />
      <textarea name="message" rows="3" cols="50"></textarea>
    </p>
    <input type="submit" value="Lähetä" />
  </form>
</body>

</html>
